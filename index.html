<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IWONK NET</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-green-50 p-4">
<div class="max-w-[400px] mx-auto">
<div class="bg-white rounded-2xl p-4 text-center font-bold">IWONK NET - BOT PPPoE</div>
<input id="nama" placeholder="Nama: Kamar" class="w-full mt-4 p-3 rounded-xl border-2 border-yellow-400 outline-none">
<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="kirim('cek')" class="bg-blue-500 text-white p-3 rounded-xl font-bold">CEK</button>
<button onclick="kirim('aktif')" class="bg-green-600 text-white p-3 rounded-xl font-bold">AKTIF</button>
<button onclick="kirim('kick')" class="bg-yellow-500 text-white p-3 rounded-xl font-bold">KICK</button>
<button onclick="kirim('total')" class="bg-purple-600 text-white p-3 rounded-xl font-bold">TOTAL</button>
<button onclick="kirim('hapus')" class="bg-orange-500 text-white p-3 rounded-xl font-bold">HAPUS</button>
<button onclick="kirim('hapusaktif')" class="bg-red-600 text-white p-3 rounded-xl font-bold">HAPUS AKTIF</button>
</div></div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
function kirim(t){
 let n=document.getElementById('nama').value.trim();
 let cmd="";
 if(t=='cek'){if(!n){alert('Isi nama dulu bos!');return;}cmd='/cek '+n;}
 else if(t=='kick'){if(!n){alert('Isi nama dulu!');return;}cmd='/kick '+n;}
 else if(t=='hapus'){if(!n){alert('Isi nama dulu!');return;}cmd='/hapus '+n;}
 else if(t=='hapusaktif'){if(!n){alert('Isi nama dulu!');return;}cmd='/hapusaktif '+n;}
 else if(t=='aktif')cmd='/aktif';
 else if(t=='total')cmd='/total';
 tg.sendData(cmd);
 setTimeout(()=>{tg.close();},500);
}
</script></body></html>
