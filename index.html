<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IWONK NET - LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#f0fdf4}</style>
</head>
<body class="p-3">
<div class="max-w-[480px] mx-auto">
<div class="bg-[#4CAF6D] rounded-[24px] p-5 text-white">
<h1 class="text-2xl font-extrabold">IWONK NET • LIVE</h1>
<p id="connStatus" class="text-sm opacity-80">Belum konek - Buka Pengaturan</p>
</div>

<div class="bg-white rounded-2xl p-4 mt-4 shadow">
<h3 class="font-bold text-[#0a5c2f]">⚙️ PENGATURAN MIKROTIK</h3>
<input id="host" value="sin22.tunnel.id:3113" class="w-full mt-2 bg-gray-100 p-3 rounded-xl text-sm" placeholder="sin22.tunnel.id:3113">
<input id="user" value="iwonk-api" class="w-full mt-2 bg-gray-100 p-3 rounded-xl text-sm" placeholder="Username API">
<input id="pass" type="password" value="Iwonk12345" class="w-full mt-2 bg-gray-100 p-3 rounded-xl text-sm" placeholder="Password API">
<div class="flex gap-2 mt-3">
<button onclick="saveSet()" class="flex-1 bg-[#4CAF6D] text-white py-3 rounded-xl font-bold">SIMPAN & KONEK</button>
<button onclick="testConn()" class="flex-1 bg-black text-white py-3 rounded-xl font-bold">TEST</button>
</div>
<p class="text-[10px] text-gray-400 mt-2">Host lu: sin22.tunnel.id:3113 | Pakai https:// di depan otomatis</p>
</div>

<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-[#e6f4ea] rounded-2xl p-4 text-center"><p class="text-xs">TOTAL</p><p id="stTotal" class="text-3xl font-extrabold">-</p></div>
<div class="bg-[#e6f4ea] rounded-2xl p-4 text-center"><p class="text-xs">AKTIF</p><p id="stAktif" class="text-3xl font-extrabold text-green-600">-</p></div>
</div>

<div class="mt-4 flex gap-2">
<input id="q" oninput="render()" placeholder="Cari nama/IP..." class="flex-1 bg-white rounded-full px-5 py-3 shadow">
<button onclick="loadData()" class="bg-[#4CAF6D] text-white px-5 rounded-full font-bold">REFRESH</button>
</div>

<div id="list" class="mt-4 space-y-2"></div>
<div id="log" class="mt-4 bg-black text-green-400 p-3 rounded-xl text-[11px] h-32 overflow-auto">Log: Siap...</div>
</div>

<script>
let S = JSON.parse(localStorage.getItem('iwonk_live_set')||'{"host":"sin22.tunnel.id:3113","user":"iwonk-api","pass":"Iwonk12345"}');
document.getElementById('host').value=S.host;document.getElementById('user').value=S.user;document.getElementById('pass').value=S.pass;
let pppActive=[], pppSecret=[];

function getBase(){
let h=S.host.trim(); if(!h.startsWith('http')) h='http://'+h;
return h.replace(/\/$/,'');
}
function getAuth(){return 'Basic '+btoa(S.user+':'+S.pass)}
function log(t){document.getElementById('log').innerHTML+= '<br>'+t; document.getElementById('log').scrollTop=9999}
function saveSet(){
S={host:document.getElementById('host').value, user:document.getElementById('user').value, pass:document.getElementById('pass').value};
localStorage.setItem('iwonk_live_set',JSON.stringify(S));
log('Setting disimpan: '+getBase()); testConn();
}

async function api(path, method='GET', body=null){
let url=getBase()+'/rest'+path;
let opt={method, headers:{'Authorization':getAuth(),'Content-Type':'application/json'}, mode:'cors'};
if(body) opt.body=JSON.stringify(body);
try{
let r=await fetch(url, opt);
if(!r.ok){let txt=await r.text(); throw new Error(r.status+' '+txt)}
return await r.json();
}catch(e){log('❌ API Error '+path+': '+e.message); throw e}
}

async function testConn(){
log('Test konek ke '+getBase()+' ...');
try{
let res=await api('/system/resource');
document.getElementById('connStatus').innerText='✅ Konek - '+res['board-name']+' Uptime '+res.uptime;
log('✅ Konek OK: '+res['board-name']);
loadData();
}catch(e){document.getElementById('connStatus').innerText='❌ Gagal konek - Cek IP/user/pass & CORS' }
}

async function loadData(){
log('Load PPPoE...');
try{
pppActive=await api('/ppp/active');
pppSecret=await api('/ppp/secret');
document.getElementById('stTotal').innerText=pppSecret.length;
document.getElementById('stAktif').innerText=pppActive.length;
render();
log('✅ Load OK - Aktif:'+pppActive.length+' Total:'+pppSecret.length);
}catch(e){log('Gagal load, cek tunnel & enable api-ssl')}
}

function render(){
let q=document.getElementById('q').value.toLowerCase();
let list=document.getElementById('list'); list.innerHTML='';
let show=pppActive.filter(a=> (a.name||'').toLowerCase().includes(q) || (a.address||'').includes(q));
show.slice(0,50).forEach(a=>{
list.innerHTML+=`<div class="bg-white p-3 rounded-2xl shadow flex justify-between"><div><p class="font-bold">${a.name}</p><p class="text-xs text-gray-500">${a.address} • ${a.uptime} • ${a['caller-id']||''}</p></div><div class="flex gap-1"><button onclick="kick('${a.name}')" class="bg-orange-500 text-white px-3 py-2 rounded-lg text-xs">KICK</button><button onclick="hapus('${a.name}')" class="bg-red-600 text-white px-3 py-2 rounded-lg text-xs">HAPUS</button></div></div>`;
});
if(show.length===0 && pppActive.length>0) list.innerHTML='<p class="text-center text-sm text-gray-400">Tidak ada hasil</p>';
}

async function kick(name){
if(!confirm('Kick '+name+'?')) return;
log('Kick '+name+'...');
try{await api('/ppp/active/remove', 'POST', {'.id': pppActive.find(x=>x.name===name)?.['.id'] || name}); log('✅ Kick OK'); loadData();}catch(e){ // fallback by name
try{let act=pppActive.find(x=>x.name===name); if(act) await api('/ppp/active/'+act['.id'], 'DELETE'); log('✅ Kick OK'); loadData();}catch(e2){log('Kick gagal: '+e2.message)}
}
}
async function hapus(name){
if(!confirm('HAPUS secret '+name+'? Ini hapus permanen!')) return;
log('Hapus '+name+'...');
try{
let sec=pppSecret.find(x=>x.name===name);
if(sec) await api('/ppp/secret/'+sec['.id'], 'DELETE');
let act=pppActive.find(x=>x.name===name);
if(act) try{await api('/ppp/active/'+act['.id'], 'DELETE');}catch{}
log('✅ Hapus OK'); loadData();
}catch(e){log('Hapus gagal: '+e.message)}
}
loadData();
</script>
</body>
</html>
