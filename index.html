<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IWONK NET v4 - LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#f0fdf4}.card{box-shadow:0 6px 24px rgba(0,0,0,.07)}</style>
</head>
<body class="p-3 pb-20">
<div class="max-w-[480px] mx-auto">
<div class="bg-[#4CAF6D] rounded-[24px] p-5 text-white card">
<h1 class="text-[22px] font-extrabold">IWONK NET • LIVE v4</h1>
<p id="connStatus" class="text-[13px] mt-1 bg-black/20 inline-block px-3 py-1 rounded-full">⏳ Belum konek</p>
</div>

<div class="bg-white rounded-2xl p-4 mt-4 card">
<h3 class="font-bold text-[#0a5c2f] text-sm">⚙️ PENGATURAN MIKROTIK</h3>
<input id="host" class="w-full mt-2 bg-[#eef6f0] p-3 rounded-xl text-sm outline-none border-2 border-transparent focus:border-[#4CAF6D]" value="sin22.tunnel.id:3113">
<div class="grid grid-cols-2 gap-2 mt-2">
<input id="user" class="bg-[#eef6f0] p-3 rounded-xl text-sm outline-none" value="iwonk-api" placeholder="user api">
<input id="pass" type="text" class="bg-[#eef6f0] p-3 rounded-xl text-sm outline-none" value="Iwonk12345" placeholder="pass api">
</div>
<div class="flex items-center gap-2 mt-3">
<label class="flex items-center gap-2 text-xs"><input type="checkbox" id="useProxy" checked class="w-4 h-4"> Pakai Proxy Anti-CORS (wajib buat GitHub)</label>
</div>
<div class="flex gap-2 mt-3">
<button onclick="saveSet()" class="flex-1 bg-[#4CAF6D] text-white py-3 rounded-xl font-bold text-sm">SIMPAN & KONEK</button>
<button onclick="testConn()" class="w-[90px] bg-black text-white py-3 rounded-xl font-bold text-sm">TEST</button>
</div>
</div>

<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-white rounded-2xl p-4 text-center card"><p class="text-[11px] opacity-70">TOTAL SECRET</p><p id="stTotal" class="text-[32px] font-extrabold">-</p></div>
<div class="bg-white rounded-2xl p-4 text-center card"><p class="text-[11px] opacity-70">AKTIF ONLINE</p><p id="stAktif" class="text-[32px] font-extrabold text-green-600">-</p></div>
</div>

<div class="mt-4 flex gap-2">
<input id="q" oninput="render()" placeholder="Cari nama / IP / PPPoE..." class="flex-1 bg-white rounded-full px-5 py-3 shadow outline-none text-sm">
<button onclick="loadData()" class="bg-[#4CAF6D] text-white px-5 rounded-full font-bold text-sm">REFRESH</button>
</div>

<div id="list" class="mt-4 space-y-2"></div>

<div class="mt-4 bg-black rounded-xl p-3">
<p class="text-[10px] text-gray-400">LOG v4 - Proxy: corsproxy.io</p>
<div id="log" class="text-green-400 text-[11px] h-28 overflow-auto mt-1">Siap v4... Klik SIMPAN & KONEK</div>
</div>

<p class="text-center text-[10px] text-gray-400 mt-4">Mode v4: Jika diupload ke Files MikroTik akses via http://sin22.tunnel.id:3113/index.html = tanpa proxy. Jika dari github.io = pakai proxy.</p>
</div>

<script>
let S = JSON.parse(localStorage.getItem('iwonk_v4')||'{"host":"sin22.tunnel.id:3113","user":"iwonk-api","pass":"Iwonk12345","useProxy":true}');
host.value=S.host; user.value=S.user; pass.value=S.pass; useProxy.checked=S.useProxy!==false;
let pppActive=[], pppSecret=[];
const PROXIES=[
  h=>`https://corsproxy.io/?${encodeURIComponent('http://'+h)}`,
  h=>`https://api.allorigins.win/raw?url=${encodeURIComponent('http://'+h)}`,
  h=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent('http://'+h)}`
];
function getAuth(){return 'Basic '+btoa(S.user+':'+S.pass)}
function log(t){let el=document.getElementById('log'); el.innerHTML+= '<br>'+t; el.scrollTop=9999}
function saveSet(){
  S={host:document.getElementById('host').value.trim(), user:document.getElementById('user').value.trim(), pass:document.getElementById('pass').value.trim(), useProxy:document.getElementById('useProxy').checked};
  localStorage.setItem('iwonk_v4', JSON.stringify(S));
  log('Set disimpan: '+S.host+' proxy:'+S.useProxy); testConn();
}
async function apiFetch(url, method, body){
  let opt={method, headers:{'Authorization':getAuth(),'Content-Type':'application/json'}};
  if(body) opt.body=JSON.stringify(body);
  let r=await fetch(url, opt);
  if(!r.ok){let txt=await r.text().catch(()=> ''); throw new Error(r.status+' '+txt.slice(0,200)) }
  return await r.json();
}
async function api(path, method='GET', body=null){
  let hostClean=S.host.replace(/^https?:\/\//,'').replace(/\/$/,'');
  let isSameOrigin = location.hostname && hostClean.startsWith(location.hostname);
  // 1. Jika akses dari tunnel itu sendiri (upload ke Files MikroTik) -> pakai /rest langsung tanpa proxy
  if(isSameOrigin){
    return await apiFetch('/rest'+path, method, body);
  }
  // 2. Jika dari github.io -> pakai proxy
  if(S.useProxy){
    for(let i=0;i<PROXIES.length;i++){
      try{
        let proxyUrl = PROXIES[i](hostClean+'/rest'+path);
        log('Coba proxy '+(i+1)+'...');
        return await apiFetch(proxyUrl, method, body);
      }catch(e){ log('Proxy '+(i+1)+' gagal: '+e.message); if(i===PROXIES.length-1) throw e; }
    }
  } else {
    // direct http (akan fail di https tapi coba)
    return await apiFetch('http://'+hostClean+'/rest'+path, method, body);
  }
}
async function testConn(){
  log('Test konek ke '+S.host+' ...');
  connStatus.innerText='⏳ Testing...';
  try{
    let res=await api('/system/resource');
    connStatus.innerText='✅ Konek: '+(res['board-name']||'MikroTik')+' | '+ (res.version||'');
    connStatus.className='text-[13px] mt-1 bg-white text-green-700 inline-block px-3 py-1 rounded-full font-bold';
    log('✅ KONEK OK: '+JSON.stringify(res).slice(0,200));
    loadData();
  }catch(e){
    connStatus.innerText='❌ Gagal: '+e.message.slice(0,80);
    log('❌ GAGAL: '+e.message+' | Pastikan di MikroTik: /ip service enable www & api, dan user iwon-api ada');
  }
}
async function loadData(){
  try{
    log('Load ppp/active & ppp/secret...');
    pppActive=await api('/ppp/active');
    pppSecret=await api('/ppp/secret');
    stTotal.innerText=pppSecret.length; stAktif.innerText=pppActive.length;
    render(); log('✅ Load OK');
  }catch(e){ log('Load gagal: '+e.message) }
}
function render(){
  let q=document.getElementById('q').value.toLowerCase();
  let list=document.getElementById('list'); list.innerHTML='';
  let filtered=pppActive.filter(a=> (a.name||'').toLowerCase().includes(q) || (a.address||'').includes(q) );
  filtered.slice(0,100).forEach(a=>{
    list.innerHTML+=`<div class="bg-white p-3 rounded-2xl shadow flex justify-between items-center"><div><p class="font-bold text-sm">${a.name}</p><p class="text-[11px] text-gray-500">${a.address||'-'} • ${a.uptime||'-'}</p></div><div class="flex gap-1"><button onclick="kick('${a.name}')" class="bg-orange-500 text-white px-3 py-2 rounded-lg text-[11px] font-bold">KICK</button><button onclick="hapus('${a.name}')" class="bg-red-600 text-white px-3 py-2 rounded-lg text-[11px] font-bold">HAPUS</button></div></div>`;
  });
  if(filtered.length===0) list.innerHTML='<p class="text-center text-xs text-gray-400 py-4">Tidak ada data aktif / belum load</p>';
}
async function kick(name){
  if(!confirm('Kick '+name+'?')) return;
  let act=pppActive.find(x=>x.name===name); if(!act){log('ID tidak ketemu');return}
  try{ await api('/ppp/active/'+act['.id'], 'DELETE'); log('✅ Kick '+name+' OK'); loadData(); }catch(e){log('Kick gagal: '+e.message)}
}
async function hapus(name){
  if(!confirm('HAPUS permanen '+name+'?')) return;
  let sec=pppSecret.find(x=>x.name===name);
  try{
    if(sec) await api('/ppp/secret/'+sec['.id'], 'DELETE');
    let act=pppActive.find(x=>x.name===name); if(act) await api('/ppp/active/'+act['.id'], 'DELETE').catch(()=>{});
    log('✅ Hapus '+name+' OK'); loadData();
  }catch(e){log('Hapus gagal: '+e.message)}
}
</script>
</body>
</html>
